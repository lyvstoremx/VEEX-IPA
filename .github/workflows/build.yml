name: build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: lua
        run: |
          curl -L --retry 5 --retry-delay 3 -o lua.tgz https://github.com/lua/lua/archive/refs/tags/v5.4.7.tar.gz
          tar xzf lua.tgz
          mv lua-5.4.7 lua-src
          sed -i '' 's/^#define l_system(cmd).*/#define l_system(cmd) 0/' lua-src/loslib.c

      - name: build
        run: |
          mkdir -p out
          SRC=$(ls lua-src/*.c | grep -v '/lua\.c' | grep -v '/luac\.c')
          clang -dynamiclib -arch arm64 -fobjc-arc -O2 -Isrc -Ilua-src \
            -install_name @rpath/veex.dylib \
            -framework Foundation -framework UIKit -framework CoreGraphics -framework QuartzCore \
            -o out/veex.dylib src/shell.m src/fishhook.c $SRC

      - uses: actions/upload-artifact@v4
        with:
          name: veex
          path: out/veex.dylib
