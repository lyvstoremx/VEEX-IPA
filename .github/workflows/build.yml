name: build
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  dylib:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: sdk
        run: echo "SDK=$(xcrun --sdk iphoneos --show-sdk-path)" >> $GITHUB_ENV
      - name: compile
        run: |
          xcrun --sdk iphoneos clang -arch arm64 -dynamiclib -O2 \
            -isysroot "$SDK" -miphoneos-version-min=14.0 \
            -framework UIKit -framework Foundation -framework CoreGraphics \
            -I src -I lua \
            src/shell.m src/fishhook.c lua/*.c \
            -o VEEX.dylib
      - name: sign
        run: |
          ldid -S VEEX.dylib || codesign -s - -f VEEX.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: VEEX
          path: VEEX.dylib
