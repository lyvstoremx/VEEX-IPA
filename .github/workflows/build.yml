name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Lua
        run: |
          curl -sLO https://www.lua.org/ftp/lua-5.4.7.tar.gz
          tar xf lua-5.4.7.tar.gz
          rm -f lua-5.4.7/src/lua.c lua-5.4.7/src/luac.c
      - name: Compilar
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun --sdk iphoneos clang -arch arm64 -dynamiclib -fobjc-arc -O2 \
            -isysroot "$SDK" -miphoneos-version-min=15.0 \
            -DLUA_USE_POSIX -I lua-5.4.7/src \
            -framework UIKit -framework Foundation -framework Security \
            -install_name @executable_path/veex.dylib \
            src/shell.m lua-5.4.7/src/*.c -x none \
            -o veex.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: veex
          path: veex.dylib
