name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Lua
        run: |
          curl -sL --retry 5 --retry-all-errors --max-time 120 \
            https://github.com/lua/lua/archive/refs/tags/v5.4.7.tar.gz -o lua.tgz
          tar xf lua.tgz
          mv lua-5.4.7 lua
          rm -f lua/lua.c lua/luac.c lua/onelua.c
      - name: Compilar
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun --sdk iphoneos clang -arch arm64 -dynamiclib -fobjc-arc -O2 \
            -isysroot "$SDK" -miphoneos-version-min=15.0 \
            -DLUA_USE_POSIX -I lua \
            -framework UIKit -framework Foundation -framework Security \
            -install_name @executable_path/veex.dylib \
            src/shell.m lua/*.c -x none \
            -o veex.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: veex
          path: veex.dylib
