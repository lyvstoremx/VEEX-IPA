name: frida-server tipa

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: deps
        run: brew install xz

      - name: wrap
        run: |
          set -euo pipefail
          V=17.26.3
          curl -fL -o frida.deb "https://github.com/frida/frida/releases/download/$V/frida_${V}_iphoneos-arm64.deb"
          ar x frida.deb
          D=$(ls data.tar.* | head -1)
          case "$D" in
            *.xz)  unxz "$D";   D="${D%.xz}" ;;
            *.gz)  gunzip "$D"; D="${D%.gz}" ;;
            *.lzma) unlzma "$D"; D="${D%.lzma}" ;;
          esac
          tar xf "$D"
          BIN=$(find . -name 'frida-server' -type f | head -1)
          echo "binario: $BIN"
          mkdir -p Payload/frida-server.app
          lipo "$BIN" -thin arm64 -output Payload/frida-server.app/frida-server
          chmod +x Payload/frida-server.app/frida-server
          file Payload/frida-server.app/frida-server
          codesign --remove-signature Payload/frida-server.app/frida-server || true
          cp frida/Info.plist Payload/frida-server.app/Info.plist
          codesign --force --sign - --entitlements frida/entitlements.plist Payload/frida-server.app/frida-server
          echo "--- entitlements inyectados ---"
          codesign -d --entitlements :- Payload/frida-server.app/frida-server
          zip -r frida-server.tipa Payload
          ls -la frida-server.tipa

      - name: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: frida-${{ github.run_number }}
          name: frida-server ${{ github.run_number }}
          body: |
            frida-server 17.26.3 empaquetado como tipa para TrollStore.
            Instalar en el 7 Plus con:
            apple-magnifier://install?url=https://github.com/lyvstoremx/VEEX-IPA/releases/download/frida-${{ github.run_number }}/frida-server.tipa
          files: frida-server.tipa

      - name: link
        run: |
          echo "### Instala esto en el 7 Plus" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "apple-magnifier://install?url=https://github.com/lyvstoremx/VEEX-IPA/releases/download/frida-${{ github.run_number }}/frida-server.tipa" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
