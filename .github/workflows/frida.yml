name: frida-gadget

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: deps
        run: brew install xz

      - name: gadget
        run: |
          set -euo pipefail
          V=17.26.3
          curl -fL -o g.xz "https://github.com/frida/frida/releases/download/$V/frida-gadget-${V}-ios-universal.dylib.xz"
          unxz g.xz
          cp g FridaGadget.dylib
          file FridaGadget.dylib
          cat > FridaGadget.config.json <<'EOF'
          {
            "interaction": {
              "type": "listen",
              "address": "0.0.0.0",
              "port": 27042,
              "on_load": "resume"
            }
          }
          EOF
          zip FridaGadget.zip FridaGadget.dylib FridaGadget.config.json
          ls -la

      - name: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gadget-${{ github.run_number }}
          name: frida-gadget ${{ github.run_number }}
          body: |
            frida-gadget 17.26.3 para TrollFools.
            https://github.com/lyvstoremx/VEEX-IPA/releases/download/gadget-${{ github.run_number }}/FridaGadget.zip
          files: FridaGadget.zip
